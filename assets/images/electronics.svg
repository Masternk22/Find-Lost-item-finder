<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Electronics and study items">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef7ff"/>
      <stop offset="100%" stop-color="#d7e9ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fb2ff"/>
      <stop offset="100%" stop-color="#385fd7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#173056" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="170" fill="#fff" opacity="0.35"/>
  <circle cx="140" cy="670" r="210" fill="#fff" opacity="0.22"/>

  <g filter="url(#shadow)">
    <rect x="180" y="190" width="460" height="290" rx="30" fill="#16233f"/>
    <rect x="210" y="220" width="400" height="220" rx="16" fill="url(#screen)"/>
    <rect x="145" y="510" width="530" height="42" rx="21" fill="#283958"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="230" width="180" height="250" rx="28" fill="#f9fbff" stroke="#d7e2f3" stroke-width="4"/>
    <rect x="752" y="264" width="116" height="28" rx="8" fill="#c3d2ee"/>
    <g fill="#7e90b6">
      <rect x="748" y="318" width="30" height="30" rx="7"/>
      <rect x="789" y="318" width="30" height="30" rx="7"/>
      <rect x="830" y="318" width="30" height="30" rx="7"/>
      <rect x="748" y="360" width="30" height="30" rx="7"/>
      <rect x="789" y="360" width="30" height="30" rx="7"/>
      <rect x="830" y="360" width="30" height="30" rx="7"/>
      <rect x="748" y="402" width="30" height="30" rx="7"/>
      <rect x="789" y="402" width="30" height="30" rx="7"/>
      <rect x="830" y="402" width="30" height="30" rx="7"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="890" y="470" width="140" height="70" rx="35" fill="#ffffff" stroke="#d7e2f3" stroke-width="4"/>
    <circle cx="930" cy="505" r="24" fill="#1a2743"/>
    <rect x="943" y="493" width="52" height="24" rx="12" fill="#1a2743"/>
    <circle cx="930" cy="505" r="10" fill="#dbe6ff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="560" width="260" height="90" rx="26" fill="#14233e"/>
